[package]
name = "alfavit-desktop"
version = "0.1.1"
description = "Alfavit — Uzbek script live converter"
authors = ["Alfavit"]
edition = "2021"

[lib]
name = "alfavit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"

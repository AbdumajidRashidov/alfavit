name = "alfavit-bot"
main = "src/worker.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# LOGO_URL is public (non-secret) — the inline result thumbnail.
# Served from our own Cloudflare Pages deploy; switch to https://alfavit.uz/logo.png
# once the custom domain is attached.
[vars]
LOGO_URL = "https://alfavit-web.pages.dev/logo.png"

# BOT_TOKEN is a secret — do NOT put it here. Set it with:
#   pnpm --dir apps/bot exec wrangler secret put BOT_TOKEN

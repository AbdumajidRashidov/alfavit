name = "alfavit-bot"
main = "src/worker.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# LOGO_URL is public (non-secret) — the inline result thumbnail.
# Served from our own domain (alfavit.uz custom domain on the Pages project).
[vars]
LOGO_URL = "https://alfavit.uz/logo.png"

# BOT_TOKEN is a secret — do NOT put it here. Set it with:
#   pnpm --dir apps/bot exec wrangler secret put BOT_TOKEN

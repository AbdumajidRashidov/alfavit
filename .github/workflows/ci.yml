name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-tools  # xkbcli, for the Linux layout's behavioural test
      - run: pnpm test   # turbo run test (unit tests; engine built first via ^build)
        env:
          REQUIRE_XKBCLI: '1'  # fail, not skip, if xkbcli is missing
      - run: pnpm build  # turbo run build (type-check + emit, incl. web dist)
      - run: pnpm --dir packages/layouts generate && git diff --exit-code -- packages/layouts/out apps/web/public/download  # generated layouts and downloads must be committed as generated
      - run: pnpm --dir apps/web test:dist  # build-output assertions against fresh dist
      - run: pnpm --dir packages/engine test:dist  # published engine must import under plain Node ESM

name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test   # turbo run test (unit tests; engine built first via ^build)
      - run: pnpm build  # turbo run build (type-check + emit, incl. web dist)
      - run: pnpm --dir apps/web test:dist  # build-output assertions against fresh dist
      - run: pnpm --dir packages/engine test:dist  # published engine must import under plain Node ESM
